<!DOCTYPE html>
<html>
<head>
    <title>视频问诊</title>
    <meta charset="UTF-8">
    <style>
        .video-container {
            display: flex;
            justify-content: space-around;
            margin: 20px;
        }
        video {
            width: 400px;
            height: 300px;
            border: 1px solid #ccc;
            background: #f0f0f0;
        }
        .controls {
            text-align: center;
            margin: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 0 10px;
            cursor: pointer;
        }
        .status {
            text-align: center;
            color: #666;
            margin: 10px;
        }
        .error {
            color: red;
            text-align: center;
            margin: 10px;
        }
        .room-info {
            text-align: center;
            margin: 20px;
        }
        input {
            padding: 5px;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="room-info">
        <input type="text" id="roomId" placeholder="请输入房间号">
        <button id="joinButton">加入房间</button>
    </div>
    <div class="video-container">
        <div>
            <h3>本地视频</h3>
            <video id="localVideo" autoplay playsinline></video>
        </div>
        <div>
            <h3>远程视频</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>
    <div class="status" id="status">等待加入房间...</div>
    <div class="error" id="error"></div>
    <div class="controls">
        <button id="startButton" disabled>开始通话</button>
        <button id="hangupButton" disabled>结束通话</button>
    </div>

    <!-- 使用CDN加载WebSocket客户端库 -->
    <script src="https://cdn.bootcdn.net/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    
    <script>
        let localVideo = document.getElementById('localVideo');
        let remoteVideo = document.getElementById('remoteVideo');
        let startButton = document.getElementById('startButton');
        let hangupButton = document.getElementById('hangupButton');
        let joinButton = document.getElementById('joinButton');
        let roomIdInput = document.getElementById('roomId');
        let statusDiv = document.getElementById('status');
        let errorDiv = document.getElementById('error');
        
        let localStream;
        let peerConnection;
        let stompClient;
        let currentRoom = '';
        
        function updateStatus(message) {
            statusDiv.textContent = message;
        }
        
        function showError(message) {
            errorDiv.textContent = message;
            setTimeout(() => errorDiv.textContent = '', 5000);
        }
        
        // 配置STUN服务器
        const configuration = {
            iceServers: [{
                urls: 'stun:stun.l.google.com:19302'
            }]
        };
        
        // 连接WebSocket
        function connect(roomId) {
            updateStatus('正在连接服务器...');
            let socket = new SockJS('/ws-video');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, function(frame) {
                updateStatus('服务器连接成功');
                // 订阅特定房间的消息
                stompClient.subscribe('/topic/video/' + roomId, function(message) {
                    handleSignalingData(JSON.parse(message.body));
                });
                // 启用开始通话按钮
                startButton.disabled = false;
                currentRoom = roomId;
            }, function(error) {
                showError('服务器连接失败: ' + error);
                updateStatus('连接失败');
            });
        }
        
        // 加入房间
        joinButton.onclick = () => {
            const roomId = roomIdInput.value.trim();
            if (!roomId) {
                showError('请输入房间号');
                return;
            }
            connect(roomId);
            joinButton.disabled = true;
            roomIdInput.disabled = true;
        };
        
        // 处理信令数据
        function handleSignalingData(data) {
            try {
                if (data.type === 'offer') {
                    updateStatus('收到视频通话请求...');
                    handleOffer(data);
                } else if (data.type === 'answer') {
                    updateStatus('对方接受了通话请求');
                    handleAnswer(data);
                } else if (data.type === 'ice') {
                    handleIceCandidate(data);
                }
            } catch (error) {
                showError('信令处理错误: ' + error.message);
            }
        }
        
        // 开始通话
        startButton.onclick = async () => {
            try {
                updateStatus('正在请求摄像头权限...');
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: true
                });
                localVideo.srcObject = localStream;
                updateStatus('摄像头已开启');
                
                peerConnection = new RTCPeerConnection(configuration);
                
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
                
                peerConnection.ontrack = event => {
                    remoteVideo.srcObject = event.streams[0];
                    updateStatus('对方已加入通话');
                };
                
                peerConnection.onicecandidate = event => {
                    if (event.candidate) {
                        stompClient.send("/app/video/ice/" + currentRoom, {}, JSON.stringify({
                            type: 'ice',
                            candidate: event.candidate
                        }));
                    }
                };
                
                startButton.disabled = true;
                hangupButton.disabled = false;
                
                updateStatus('正在发起通话...');
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                stompClient.send("/app/video/offer/" + currentRoom, {}, JSON.stringify({
                    type: 'offer',
                    sdp: offer
                }));
                
            } catch (err) {
                showError('启动失败: ' + err.message);
                updateStatus('启动失败');
            }
        };
        
        // 处理offer
        async function handleOffer(offer) {
            try {
                if (!peerConnection) {
                    await startButton.click();
                }
                await peerConnection.setRemoteDescription(new RTCSessionDescription(offer.sdp));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                stompClient.send("/app/video/answer/" + currentRoom, {}, JSON.stringify({
                    type: 'answer',
                    sdp: answer
                }));
                updateStatus('已接受通话请求');
            } catch (error) {
                showError('处理通话请求失败: ' + error.message);
            }
        }
        
        // 处理answer
        async function handleAnswer(answer) {
            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(answer.sdp));
                updateStatus('通话已建立');
            } catch (error) {
                showError('处理应答失败: ' + error.message);
            }
        }
        
        // 处理ICE候选者
        function handleIceCandidate(ice) {
            try {
                peerConnection.addIceCandidate(new RTCIceCandidate(ice.candidate));
            } catch (error) {
                showError('网络连接失败: ' + error.message);
            }
        }
        
        // 结束通话
        hangupButton.onclick = () => {
            try {
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                if (peerConnection) {
                    peerConnection.close();
                }
                localVideo.srcObject = null;
                remoteVideo.srcObject = null;
                startButton.disabled = false;
                hangupButton.disabled = true;
                if (stompClient) {
                    stompClient.disconnect();
                }
                // 重置房间状态
                joinButton.disabled = false;
                roomIdInput.disabled = false;
                currentRoom = '';
                updateStatus('通话已结束');
            } catch (error) {
                showError('结束通话时出错: ' + error.message);
            }
        };
    </script>
</body>
</html>
