server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/medical_consultation?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: HikariPool
      auto-commit: true
      connection-test-query: SELECT 1
      validation-timeout: 3000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  flyway:
    enabled: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
      FAIL_ON_EMPTY_BEANS: false
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE
    serialization-inclusion: NON_NULL
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false
    generator:
      WRITE_NUMBERS_AS_STRINGS: true
    encoder:
      ESCAPE_NON_ASCII: false
    parser:
      ALLOW_UNQUOTED_CONTROL_CHARS: true
    mapper:
      ACCEPT_CASE_INSENSITIVE_PROPERTIES: true
      USE_STD_BEAN_NAMING: true
    locale: zh_CN
    default-charset: UTF-8
  main:
    allow-bean-definition-overriding: true
  security:
    filter:
      order: -100
  mvc:
    throw-exception-if-no-handler-found: true
    pathmatch:
      matching-strategy: ant_path_matcher
  web:
    resources:
      add-mappings: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.yunchuan.medical.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: true
    use-generated-keys: true
    default-executor-type: SIMPLE
    jdbc-type-for-null: NULL

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.yunchuan.medical.entity
  configuration:
    map-underscore-to-camel-case: true
    auto-mapping-behavior: full
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  header: Authorization
  secret: your_jwt_secret_key_must_be_very_long_and_secure_123456789
  expiration: 86400000  # 24小时
  tokenPrefix: Bearer 
  issuer: medical-platform

logging:
  level:
    root: DEBUG
    com.yunchuan.medical: DEBUG
    org.springframework.security: DEBUG
    org.springframework.jdbc.core: DEBUG
    org.springframework.web: DEBUG
    org.hibernate: DEBUG
    org.flywaydb: DEBUG
    org.mybatis: DEBUG

ai:
  api-key: your-openai-api-key
  api-url: https://api.openai.com/v1/chat/completions

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    disable-swagger-default-url: true
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /v3/api-docs
        name: API Documentation
  api-docs:
    path: /v3/api-docs
    enabled: true
  packages-to-scan: com.yunchuan.medical.controller
  paths-to-match: /**

